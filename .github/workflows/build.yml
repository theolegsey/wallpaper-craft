name: Build LiveWall

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PyQt6 PyQt6-WebEngine pyinstaller

      - name: Build app
        run: python -m PyInstaller --noconfirm --clean --windowed --name LiveWall livewall.py

      - name: Zip portable version
        run: Compress-Archive -Path dist\LiveWall\* -DestinationPath LiveWall-portable.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" livewall.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall-installer
          path: installer_output/LiveWall-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LiveWall-portable
          path: LiveWall-portable.zip
